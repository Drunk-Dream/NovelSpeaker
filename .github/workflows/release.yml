name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -notmatch '^v\d+\.\d+\.\d+$') { throw 'Release tags must use vX.Y.Z.' }
          git fetch origin main
          git merge-base --is-ancestor '${{ github.sha }}' origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit reachable from main.' }
          $releaseVersion = '${{ github.ref_name }}'.Substring(1)
          "release_version=$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  quality:
    needs: validate
    uses: ./.github/workflows/quality-matrix.yml
    with:
      version: ${{ needs.validate.outputs.release_version }}

  publish:
    needs: [validate, quality]
    runs-on: windows-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore --locked-mode -r win-x64

      - name: Publish portable package
        run: dotnet publish src/NovelSpeaker.App/NovelSpeaker.App.csproj -c Release -r win-x64 --self-contained true --no-restore -p:Version=${{ needs.validate.outputs.release_version }} -p:AssemblyVersion=${{ needs.validate.outputs.release_version }}.0 -p:FileVersion=${{ needs.validate.outputs.release_version }}.0 -p:InformationalVersion=${{ needs.validate.outputs.release_version }} -o artifacts/publish

      - name: Package and verify
        shell: pwsh
        run: |
          $forbiddenFixtures = @('demo-tone.wav', 'demo-tone.mp3', 'corrupt-tone.mp3')
          $temporaryExtensions = @('.tmp', '.temp', '.partial', '.bak', '.orig', '.rej')
          $requiredRootFiles = @(
            'NovelSpeaker.exe',
            'LICENSE',
            'THIRD-PARTY-NOTICES.txt',
            'NAudio.dll',
            'NAudio.Wasapi.dll',
            'coreclr.dll',
            'hostfxr.dll',
            'hostpolicy.dll',
            'Microsoft.Data.Sqlite.dll',
            'SQLitePCLRaw.provider.winsqlite3.dll'
          )
          foreach ($required in $requiredRootFiles) {
            if (-not (Test-Path (Join-Path artifacts/publish $required) -PathType Leaf)) { throw "Package is missing $required" }
          }
          $publishedLegacyExecutables = Get-ChildItem artifacts/publish -Recurse -File |
            Where-Object { $_.Name -eq 'NovelSpeaker.App.exe' }
          if ($publishedLegacyExecutables) { throw "Package contains the legacy executable name: $($publishedLegacyExecutables.FullName -join ', ')" }
          $publishedTestAssets = Get-ChildItem artifacts/publish -Recurse -Force | Where-Object { $_.FullName -match '[\\/]TestAssets([\\/]|$)' }
          if ($publishedTestAssets) { throw "Package contains TestAssets: $($publishedTestAssets.FullName -join ', ')" }
          $publishedFixtures = Get-ChildItem artifacts/publish -Recurse -File | Where-Object { $_.Name -in $forbiddenFixtures }
          if ($publishedFixtures) { throw "Package contains test audio fixture: $($publishedFixtures.FullName -join ', ')" }
          $publishedTestAssemblies = Get-ChildItem artifacts/publish -Recurse -File | Where-Object { $_.Name -match 'Tests\.dll$' }
          if ($publishedTestAssemblies) { throw "Package contains test assembly: $($publishedTestAssemblies.FullName -join ', ')" }
          $publishedStyleGalleryAssets = Get-ChildItem artifacts/publish -Recurse -File | Where-Object { $_.Name -match 'StyleGallery' -or $_.FullName -match '[\\/]visual-review([\\/]|$)' }
          if ($publishedStyleGalleryAssets) { throw "Package contains Style Gallery asset: $($publishedStyleGalleryAssets.FullName -join ', ')" }
          $publishedTemporaryFiles = Get-ChildItem artifacts/publish -Recurse -File | Where-Object {
            $_.Name -in $temporaryExtensions -or
              $_.Extension -in $temporaryExtensions -or
              $_.Name.EndsWith('~', [StringComparison]::Ordinal)
          }
          if ($publishedTemporaryFiles) { throw "Package contains temporary file: $($publishedTemporaryFiles.FullName -join ', ')" }
          $zip = "artifacts/NovelSpeaker-v${{ needs.validate.outputs.release_version }}-win-x64.zip"
          Compress-Archive -Path artifacts/publish/* -DestinationPath $zip -Force
          $entries = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip)).Entries.FullName
          foreach ($required in $requiredRootFiles) {
            if ($entries -notcontains $required) { throw "Package is missing $required" }
          }
          $packagedLegacyExecutables = $entries |
            Where-Object { [System.IO.Path]::GetFileName($_) -eq 'NovelSpeaker.App.exe' }
          if ($packagedLegacyExecutables) { throw "ZIP contains the legacy executable name: $($packagedLegacyExecutables -join ', ')" }
          $packagedTestAssets = $entries | Where-Object { $_ -match '(^|/)TestAssets(/|$)' }
          if ($packagedTestAssets) { throw "Package contains TestAssets: $($packagedTestAssets -join ', ')" }
          $packagedFixtures = $entries | Where-Object { [System.IO.Path]::GetFileName($_) -in $forbiddenFixtures }
          if ($packagedFixtures) { throw "Package contains test audio fixture: $($packagedFixtures -join ', ')" }
          $packagedTestAssemblies = $entries | Where-Object { [System.IO.Path]::GetFileName($_) -match 'Tests\.dll$' }
          if ($packagedTestAssemblies) { throw "Package contains test assembly: $($packagedTestAssemblies -join ', ')" }
          $packagedStyleGalleryAssets = $entries | Where-Object { [System.IO.Path]::GetFileName($_) -match 'StyleGallery' -or $_ -match '(^|/)visual-review(/|$)' }
          if ($packagedStyleGalleryAssets) { throw "Package contains Style Gallery asset: $($packagedStyleGalleryAssets -join ', ')" }
          $packagedTemporaryFiles = $entries | Where-Object {
            $name = [System.IO.Path]::GetFileName($_)
            $extension = [System.IO.Path]::GetExtension($name)
            $name -and (
              $name -in $temporaryExtensions -or
              $extension -in $temporaryExtensions -or
              $name.EndsWith('~', [StringComparison]::Ordinal))
          }
          if ($packagedTemporaryFiles) { throw "ZIP contains temporary file: $($packagedTemporaryFiles -join ', ')" }
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() + "  " + [System.IO.Path]::GetFileName($zip) | Out-File "$zip.sha256" -Encoding ascii

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' 'artifacts/*.zip' 'artifacts/*.sha256' --generate-notes --title 'NovelSpeaker ${{ github.ref_name }}'
