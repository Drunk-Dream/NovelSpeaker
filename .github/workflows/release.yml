name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    runs-on: windows-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -notmatch '^v\d+\.\d+\.\d+$') { throw 'Release tags must use vX.Y.Z.' }
          git fetch origin main
          git merge-base --is-ancestor '${{ github.sha }}' origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit reachable from main.' }
          $releaseVersion = '${{ github.ref_name }}'.Substring(1)
          "release_version=$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  quality:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/quality-matrix.yml
    with:
      version: ${{ needs.validate.outputs.release_version }}

  publish:
    needs: [validate, quality]
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore --locked-mode -r win-x64

      - name: Publish portable package
        run: dotnet publish src/NovelSpeaker.App/NovelSpeaker.App.csproj -c Release -r win-x64 --self-contained true --no-restore -p:Version=${{ needs.validate.outputs.release_version }} -p:AssemblyVersion=${{ needs.validate.outputs.release_version }}.0 -p:FileVersion=${{ needs.validate.outputs.release_version }}.0 -p:InformationalVersion=${{ needs.validate.outputs.release_version }} -o artifacts/publish

      - name: Package and verify
        shell: pwsh
        run: |
          . tools/ReleasePackageValidation.ps1
          Assert-ReleasePackageDirectory -Path artifacts/publish
          $zip = "artifacts/NovelSpeaker-v${{ needs.validate.outputs.release_version }}-win-x64.zip"
          Compress-Archive -Path artifacts/publish/* -DestinationPath $zip -Force
          Assert-ReleasePackageZip -Path $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() + "  " + [System.IO.Path]::GetFileName($zip) | Out-File "$zip.sha256" -Encoding ascii

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag 'artifacts/*.zip' 'artifacts/*.sha256' --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to update GitHub release $tag." }
          }
          else {
            gh release create $tag 'artifacts/*.zip' 'artifacts/*.sha256' --generate-notes --title "NovelSpeaker $tag"
            if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub release $tag." }
          }
